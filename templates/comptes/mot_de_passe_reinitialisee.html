{% extends "base.html" %}

{% block titre %}Mot de passe réinitialisé — Green Dev Africa{% endblock %}
{% block classe_page %}page-auth page-connexion{% endblock %}

{% block contenu %}
  <header class="auth-entete">
    <span class="auth-icone" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <rect x="4.5" y="10" width="15" height="11" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15" r="1"></circle>
      </svg>
    </span>
    <h1>Mot de passe réinitialisé</h1>
    <p class="chapeau">Tu peux te reconnecter avec ton nouveau mot de passe.</p>
  </header>

  <div class="carte connexion-carte">
    <p class="discret"><a href="{% url 'connexion' %}">Se connecter</a></p>
  </div>
{% endblock %}
